<!DOCTYPE html><html lang="zh-Hant"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#182532;font:15px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:64px auto;padding:0 24px}.eyebrow{color:#476b65;letter-spacing:.13em;font-size:12px;font-weight:700}h1{font-size:34px;letter-spacing:-.04em;margin:8px 0}p{color:#617080}.panel{background:white;border:1px solid #dfe5e8;border-radius:18px;padding:24px;margin-top:24px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;border-radius:9px;padding:10px 16px;border:1px solid #d8dfe3}button{cursor:pointer;background:#215d50;color:white;border-color:#215d50}button.secondary{background:white;color:#215d50}button:disabled{opacity:.45;cursor:default}#message{margin-top:18px;white-space:pre-wrap}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e9edef;vertical-align:top}th{color:#687787;font-size:12px}td:nth-child(2){min-width:230px}a{color:#236d96}.badge{display:inline-block;white-space:nowrap;padding:3px 9px;border-radius:6px;background:#edf3f1}.review,.error{background:#fff1d9}.duplicate{background:#eef0f3}.muted{color:#76828d;font-size:13px}#empty{padding:42px 12px;text-align:center;color:#82908d}@media(max-width:600px){main{margin:24px auto}h1{font-size:27px}.panel{padding:16px}}
</style></head><body><main><div class="eyebrow">GMAIL → NOTION</div><h1>申請紀錄小幫手</h1><p>把 LinkedIn 申請確認信，整理到你的 Job Tracker。</p>
<div class="panel"><div class="toolbar" style="margin-bottom:16px"><label for="startDate">開始日期</label><input type="date" id="startDate" min="1970-01-01" max="9998-12-31"><label for="endDate">結束日期</label><input type="date" id="endDate" min="1970-01-01" max="9998-12-31"></div><p class="muted" id="dateHint"></p><div class="toolbar"><label for="limit">範圍內最多讀取</label><select id="limit"><option value="5">5 封確認信</option><option value="10">10 封確認信</option><option value="25">25 封確認信</option><option value="50">50 封確認信</option></select><button id="preview">檢查並預覽</button><button class="secondary" id="import" disabled>匯入可新增項目</button></div><div id="message" role="status" aria-live="polite">先預覽五筆，確認欄位後即可匯入。</div><p class="muted">只新增缺少的申請。相同職缺會跳過；可能重複的紀錄會列出待確認。既有申請的狀態會保留。</p></div>
<div class="panel table"><div id="empty">預覽會顯示公司、職位、申請日期，以及重複檢查結果。</div><table id="table" hidden><thead><tr><th>Company</th><th>Position</th><th>Status</th><th>Website</th><th>Apply Date</th><th>檢查結果</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted">目前支援繁體中文 LinkedIn「您的應徵資料已傳送到」確認信。其他格式會保留給你手動確認。</p></main>
<script>
let ticket=null;const $=id=>document.getElementById(id);const labels={new:'可新增',duplicate:'已存在',review:'待確認',created:'已新增',error:'未完成'};
function busy(v){$('preview').disabled=v;$('limit').disabled=v;$('startDate').disabled=v;$('endDate').disabled=v;$('import').disabled=v||!ticket;}
function error(e){ticket=null;busy(false);$('message').textContent=e.message||String(e);}
function render(data){$('rows').replaceChildren();$('table').hidden=!data.results.length;$('empty').hidden=!!data.results.length;
for(const r of data.results){const tr=document.createElement('tr');for(const key of ['Company','Position','Status','Website','Apply Date']){const td=document.createElement('td');if(key==='Website'&&r[key]){const a=document.createElement('a');a.href=r[key];a.textContent='LinkedIn 職缺';a.target='_blank';a.rel='noopener noreferrer';td.append(a);}else td.textContent=r[key]||'—';tr.append(td);}const td=document.createElement('td'),badge=document.createElement('span');badge.className='badge '+r.state;badge.textContent=labels[r.state]||r.state;td.append(badge);const note=document.createElement('div');note.className='muted';note.textContent=r.reason||'';td.append(note);tr.append(td);$('rows').append(tr);}}
function dateRange(){
  const start=$('startDate'),end=$('endDate');
  if(!start.checkValidity()||!end.checkValidity()) throw Error('請輸入有效日期');
  if(start.value && end.value && start.value>end.value) throw Error('開始日期不能晚於結束日期');
  const midnight=value=>{const [y,m,d]=value.split('-').map(Number);const date=new Date(0);date.setFullYear(y,m-1,d);date.setHours(0,0,0,0);return date;};
  const from=start.value?midnight(start.value):null,to=end.value?midnight(end.value):null;
  if(to) to.setDate(to.getDate()+1);
  return {startSeconds:from?Math.floor(from.getTime()/1000):null,endSeconds:to?Math.floor(to.getTime()/1000):null};
}
$('dateHint').textContent='依收信日期搜尋，包含開始與結束當天；留空代表不限。時區：'+Intl.DateTimeFormat().resolvedOptions().timeZone+'。Apply Date 仍採用信件中的應徵日期。';
for(const id of ['startDate','endDate','limit']) $(id).onchange=()=>{ticket=null;busy(false);$('rows').replaceChildren();$('table').hidden=true;$('empty').hidden=false;$('message').textContent='搜尋條件已變更，請重新預覽。';};
$('preview').onclick=()=>{let range;try{range=dateRange();}catch(e){error(e);return;}ticket=null;busy(true);$('message').textContent='正在讀取 Gmail 並檢查 Notion…';google.script.run.withSuccessHandler(data=>{render(data);const n=data.results.filter(r=>r.state==='new').length;ticket=n?data.ticket:null;busy(false);$('message').textContent='已檢查 '+data.results.length+' 筆，'+n+' 筆可新增。預覽保留 30 分鐘。'+(data.hasMore?' 範圍內還有更多信件未讀取，請增加筆數或縮小日期範圍。':'');}).withFailureHandler(error).previewApplications(Number($('limit').value),range);};
$('import').onclick=()=>{const t=ticket;ticket=null;busy(true);$('message').textContent='正在重新檢查並匯入…';google.script.run.withSuccessHandler(data=>{render(data);busy(false);$('message').textContent='完成：新增 '+data.results.filter(r=>r.state==='created').length+' 筆。可重新預覽核對；有錯誤時會停止後續新增。';}).withFailureHandler(error).importApplications(t);};
</script></body></html>
